<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Sheel Shah — machine learning, full-stack and hardware. A small neural network animates a forward pass.">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .edge { stroke: #262c36; stroke-width: 1.2; }
    .sig  { stroke: #2dd4bf; stroke-width: 2; stroke-linecap: round; fill: none;
            stroke-dasharray: 14 100; stroke-dashoffset: 14;
            animation: flow 3.6s linear infinite; }
    .node { fill: #161b22; stroke: #3d444d; stroke-width: 1.5;
            animation: fire 3.6s ease-out infinite; }
    .out  { animation-name: fireOut; }
    .lbl  { fill: #7d8590; font-size: 11px; }
    @keyframes flow { 0% { stroke-dashoffset: 14; } 17%, 100% { stroke-dashoffset: -100; } }
    @keyframes fire { 0% { fill: #161b22; stroke: #3d444d; } 6% { fill: #2dd4bf; stroke: #2dd4bf; } 22%, 100% { fill: #161b22; stroke: #3d444d; } }
    @keyframes fireOut { 0% { fill: #161b22; stroke: #3d444d; } 6% { fill: #f59e0b; stroke: #f59e0b; } 30%, 100% { fill: #161b22; stroke: #3d444d; } }
    @media (prefers-reduced-motion: reduce) { .sig, .node { animation: none; } }
  </style>
